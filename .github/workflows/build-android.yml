name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android_app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub database URL
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          repo = os.environ["REPOSITORY"]
          branch = os.environ.get("BRANCH") or "main"

          raw_url = f"https://raw.githubusercontent.com/{repo}/{branch}/data"

          with open("android_app/repo_config.json", "w", encoding="utf-8") as f:
              json.dump({"raw_base": raw_url}, f, indent=2)
              f.write("\n")

          print("SpamGuard database:", raw_url)
          PY

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: android_app
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpamGuard-ES-debug
          path: ${{ steps.buildozer.outputs.filename }}
