name: Update spam reputation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: spam-reputation-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest -v test_spam_reputation_scraper.py

      - name: Scrape, score and export
        run: |
          python backend/spam_reputation_scraper.py run \
            --db /tmp/spamguard-runtime.sqlite3 \
            --state data/spam_state.json \
            --output-dir data

      - name: Show update summary
        run: cat data/AUTO_UPDATE.md

      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          ADDED="$(python -c 'import json; print(json.load(open("data/spam_changes.json"))["added_count"])')"
          REMOVED="$(python -c 'import json; print(json.load(open("data/spam_changes.json"))["removed_count"])')"

          git commit -m "data: spam update (+${ADDED}/-${REMOVED})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
